<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>数学問題プリント生成</title>
<style>
    body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        padding: 20px;
        background-color: #f4f4f9;
        color: #333;
    }
    h2 { margin-top: 0; }
    .panel {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        margin-bottom: 20px;
    }
    .panel h3 { margin-top: 0; }
    label { display: block; margin: 8px 0 4px; font-weight: bold; font-size: 13px; }
    input[type=text], input[type=number], select, textarea {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
    }
    textarea#yamlText { height: 260px; font-family: Consolas, monospace; font-size: 13px; }
    .row2 { display: flex; gap: 12px; }
    .row2 > div { flex: 1; }
    button {
        padding: 9px 18px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        margin-right: 8px;
        margin-top: 10px;
    }
    button:hover { background-color: #0056b3; }
    button.secondary { background-color: #6c757d; }
    button.secondary:hover { background-color: #545b62; }
    button.green { background-color: #28a745; }
    button.green:hover { background-color: #1e7e34; }
    button.danger { background-color: #dc3545; }
    button.danger:hover { background-color: #a71d2a; }
    #fileInput { display: none; }
    .figure-fields { border: 1px dashed #bbb; padding: 10px; margin-top: 8px; border-radius: 4px; background: #fafafa; }
    .problem-list-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #eee;
        padding: 8px 0;
    }
    .problem-list-item .txt { flex: 1; font-size: 13px; color: #555; white-space: pre-wrap; }
    .small-btn { padding: 4px 10px; font-size: 12px; margin: 0 0 0 6px; }
    .hint { font-size: 12px; color: #888; margin-top: 2px; }

    /* ワークシート */
    #worksheet {
        background: white;
        padding: 40px;
        min-height: 1000px;
        display: none;
    }
    .ws-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 2px solid #333;
        margin-bottom: 30px;
        padding-bottom: 10px;
    }
    .ws-title { margin: 0; }
    .ws-name { font-size: 16px; }
    .prow {
        display: flex;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 26px;
        border-bottom: 1px solid #eee;
        padding-bottom: 15px;
        page-break-inside: avoid;
    }
    .p-main { flex: 1; min-width: 0; }
    .p-num { font-weight: bold; margin-right: 6px; }
    .p-text { font-size: 16px; line-height: 1.7; }
    .p-figure { margin-top: 8px; }
    .p-answer {
        width: 260px;
        min-height: 70px;
        border: 1.5px solid #000;
        flex-shrink: 0;
        background: #fff;
    }

    /* mini-math rendering */
    .mfrac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 3px; font-size: 0.95em; }
    .mfrac .num { border-bottom: 1.3px solid #333; padding: 0 4px 1px; }
    .mfrac .den { padding: 1px 4px 0; }
    .msqrt { display: inline-flex; align-items: flex-start; margin: 0 2px; }
    .msqrt .rad { font-size: 1.1em; padding-right: 1px; }
    .msqrt .content { border-top: 1.3px solid #333; padding: 0 3px; }
    sup.mexp, sub.msub { font-size: 0.7em; }

    @media print {
        .panel { display: none; }
        body { background: white; padding: 0; }
        #worksheet { display: block !important; padding: 10px; }
    }
</style>
</head>
<body>

<div class="panel">
    <h2>数学問題プリント生成</h2>
    <p class="hint">問題はフォームで追加するか、下のYAMLを直接編集してください。テキスト中は <code>$ ... $</code> で数式を書けます（例: <code>$\frac{1}{2}+\sqrt{3}$</code>）。</p>
</div>

<div class="panel">
    <h3>① 問題を追加（フォーム）</h3>
    <label>問題文（$...$ で数式、\n は改行として使えます）</label>
    <textarea id="f_text" rows="3" placeholder="例: 次の式を計算しなさい。 $\frac{1}{2} + \frac{1}{3}$"></textarea>

    <label>図（任意）</label>
    <select id="f_figtype">
        <option value="">なし</option>
        <option value="axes">座標平面・グラフ (axes)</option>
        <option value="polygon">図形 (polygon: 三角形・四角形など)</option>
        <option value="circle">円 (circle)</option>
        <option value="number_line">数直線 (number_line)</option>
    </select>

    <div id="fig_axes" class="figure-fields" style="display:none">
        <div class="row2">
            <div><label>x範囲 (min,max)</label><input type="text" id="ax_xrange" value="-5,5"></div>
            <div><label>y範囲 (min,max)</label><input type="text" id="ax_yrange" value="-5,5"></div>
        </div>
        <label>プロットする関数（xの式、カンマ区切りで複数可。例: 2*x+1, x^2-1）</label>
        <input type="text" id="ax_functions" placeholder="2*x+1">
        <label>点を打つ（任意, 例: 1,2 ; -1,0）</label>
        <input type="text" id="ax_points" placeholder="1,2 ; -1,0">
    </div>

    <div id="fig_polygon" class="figure-fields" style="display:none">
        <label>頂点座標（例: 0,0 ; 4,0 ; 2,3）</label>
        <input type="text" id="pg_points" placeholder="0,0 ; 4,0 ; 2,3">
        <label>頂点ラベル（例: A,B,C / 空欄可）</label>
        <input type="text" id="pg_labels" placeholder="A,B,C">
        <label><input type="checkbox" id="pg_lengths" style="width:auto;display:inline-block" checked> 辺の長さを表示する</label>
    </div>

    <div id="fig_circle" class="figure-fields" style="display:none">
        <div class="row2">
            <div><label>中心 (x,y)</label><input type="text" id="ci_center" value="0,0"></div>
            <div><label>半径</label><input type="number" id="ci_radius" value="3"></div>
        </div>
        <label><input type="checkbox" id="ci_show_radius" style="width:auto;display:inline-block" checked> 半径を表示する</label>
    </div>

    <div id="fig_number_line" class="figure-fields" style="display:none">
        <div class="row2">
            <div><label>最小値</label><input type="number" id="nl_min" value="-5"></div>
            <div><label>最大値</label><input type="number" id="nl_max" value="5"></div>
            <div><label>刻み</label><input type="number" id="nl_step" value="1"></div>
        </div>
        <label>強調する点（任意, カンマ区切り 例: -2,0,3）</label>
        <input type="text" id="nl_marks" placeholder="-2,0,3">
    </div>

    <button onclick="addProblemFromForm()">＋ 問題を追加</button>

    <div id="problemList" style="margin-top:14px"></div>
</div>

<div class="panel">
    <h3>② YAMLデータ</h3>
    <label>タイトル</label>
    <input type="text" id="ws_title" value="数学プリント">
    <label style="margin-top:10px">問題データ（YAML）</label>
    <textarea id="yamlText" spellcheck="false"></textarea>
    <div>
        <button class="secondary" onclick="document.getElementById('fileInput').click()">📂 YAML読み込み</button>
        <input type="file" id="fileInput" accept=".yaml,.yml,text/yaml" onchange="loadYamlFile(event)">
        <button class="secondary" onclick="downloadYaml()">💾 YAML保存</button>
        <button class="secondary" onclick="syncFormListFromYaml()">↻ フォーム一覧をYAMLから再同期</button>
    </div>
</div>

<div class="panel">
    <button onclick="generateWorksheet()">📝 ワークシートを表示</button>
    <button class="green" onclick="window.print()">🖨️ PDF / 印刷</button>
    <button class="secondary" id="shareBtn" onclick="shareWorksheet()">🔗 共有リンクを発行</button>
    <div id="shareResult" style="display:none; margin-top:12px">
        <label>共有URL（このリンクを知っている人は誰でも閲覧・印刷できます）</label>
        <div class="row2">
            <input type="text" id="shareUrl" readonly onclick="this.select()" style="flex:1">
            <button type="button" class="secondary" style="margin-top:0; flex:0 0 auto" onclick="copyShareUrl()">コピー</button>
        </div>
        <p class="hint" id="shareNote"></p>
    </div>
</div>

<div id="worksheet">
    <div class="ws-header">
        <h2 class="ws-title" id="wsTitleOut">数学プリント</h2>
        <div class="ws-name">名前: __________________________</div>
    </div>
    <div id="wsContent"></div>
</div>

<script>
/* ========================= 内部データ ========================= */
let problems = []; // {text, figure}

/* ========================= 簡易 YAML パーサ/シリアライザ ========================= */
// このツール用のスキーマ（title, problems: [{text, figure:{...}}]）を想定した
// 実用サブセットYAMLパーサ（インデント方式のマップ/リスト、フロー形式の配列に対応）

function yamlParse(src) {
    const rawLines = src.replace(/\r\n/g, '\n').split('\n');
    const lines = [];
    for (const raw of rawLines) {
        const noComment = stripComment(raw);
        if (noComment.trim() === '') continue;
        const indent = noComment.match(/^ */)[0].length;
        lines.push({ indent, content: noComment.trim() });
    }
    let pos = 0;
    function stripComment(line) {
        let inQuote = null;
        for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (inQuote) {
                if (c === inQuote) inQuote = null;
            } else if (c === '"' || c === "'") {
                inQuote = c;
            } else if (c === '#' && (i === 0 || line[i - 1] === ' ')) {
                return line.slice(0, i);
            }
        }
        return line;
    }
    function parseScalar(s) {
        s = s.trim();
        if (s === '' || s === '~' || s === 'null') return null;
        if (s === 'true') return true;
        if (s === 'false') return false;
        if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
        if ((s[0] === '"' && s[s.length - 1] === '"') || (s[0] === "'" && s[s.length - 1] === "'")) {
            return s.slice(1, -1).replace(/\\n/g, '\n').replace(/\\"/g, '"');
        }
        if (s[0] === '[' || s[0] === '{') return parseFlow(s);
        return s;
    }
    function parseFlow(s) {
        let i = 0;
        function skipSpace() { while (s[i] === ' ') i++; }
        function parseValue() {
            skipSpace();
            if (s[i] === '[') {
                i++;
                const arr = [];
                skipSpace();
                if (s[i] === ']') { i++; return arr; }
                while (true) {
                    arr.push(parseValue());
                    skipSpace();
                    if (s[i] === ',') { i++; continue; }
                    if (s[i] === ']') { i++; break; }
                    break;
                }
                return arr;
            }
            if (s[i] === '{') {
                i++;
                const obj = {};
                skipSpace();
                if (s[i] === '}') { i++; return obj; }
                while (true) {
                    skipSpace();
                    let key = '';
                    while (s[i] !== ':' && i < s.length) { key += s[i]; i++; }
                    i++; // skip ':'
                    const val = parseValue();
                    obj[key.trim()] = val;
                    skipSpace();
                    if (s[i] === ',') { i++; continue; }
                    if (s[i] === '}') { i++; break; }
                    break;
                }
                return obj;
            }
            // scalar until , or ] or }
            let start = i;
            let depth = 0;
            while (i < s.length) {
                const c = s[i];
                if (c === '[' || c === '{') depth++;
                if (c === ']' || c === '}') { if (depth === 0) break; depth--; }
                if (c === ',' && depth === 0) break;
                i++;
            }
            return parseScalar(s.slice(start, i));
        }
        return parseValue();
    }
    function parseBlock(indent) {
        if (pos >= lines.length || lines[pos].indent < indent) return null;
        if (lines[pos].content.startsWith('- ') || lines[pos].content === '-') {
            return parseSeq(indent);
        }
        return parseMap(indent);
    }
    function parseSeq(indent) {
        const arr = [];
        while (pos < lines.length && lines[pos].indent === indent &&
               (lines[pos].content === '-' || lines[pos].content.startsWith('- '))) {
            const line = lines[pos];
            const rest = line.content === '-' ? '' : line.content.slice(2);
            pos++;
            if (rest === '') {
                const child = parseBlock(indent + 1);
                arr.push(child);
            } else if (/^[A-Za-z0-9_\-]+:\s*(.*)$/.test(rest)) {
                // inline map start: "- key: value"
                const obj = {};
                const m = rest.match(/^([A-Za-z0-9_\-]+):\s*(.*)$/);
                if (m[2] !== '') obj[m[1]] = parseScalar(m[2]);
                else obj[m[1]] = parseBlock(indent + 2) ?? null;
                // continue reading sibling keys at indent+2
                while (pos < lines.length && lines[pos].indent === indent + 2) {
                    const mm = lines[pos].content.match(/^([A-Za-z0-9_\-]+):\s*(.*)$/);
                    if (!mm) break;
                    pos++;
                    if (mm[2] !== '') obj[mm[1]] = parseScalar(mm[2]);
                    else obj[mm[1]] = parseBlock(indent + 4) ?? null;
                }
                arr.push(obj);
            } else {
                arr.push(parseScalar(rest));
            }
        }
        return arr;
    }
    function parseMap(indent) {
        const obj = {};
        while (pos < lines.length && lines[pos].indent === indent) {
            const m = lines[pos].content.match(/^([^:]+):\s*(.*)$/);
            if (!m) break;
            const key = m[1].trim();
            const valStr = m[2];
            pos++;
            if (valStr !== '') {
                obj[key] = parseScalar(valStr);
            } else {
                const child = parseBlock(indent + 2);
                obj[key] = child;
            }
        }
        return obj;
    }
    return parseMap(0);
}

function yamlEscapeString(s) {
    if (s === null || s === undefined) return '';
    if (/^[\w\-.\s]+$/.test(s) && !/^\s|\s$/.test(s) && s !== '') return s;
    return '"' + String(s).replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"';
}

function yamlStringify(data) {
    let out = '';
    out += 'title: ' + yamlEscapeString(data.title || '') + '\n';
    out += 'problems:\n';
    for (const p of (data.problems || [])) {
        out += '  - text: ' + yamlEscapeString(p.text || '') + '\n';
        if (p.figure) {
            out += '    figure:\n';
            for (const [k, v] of Object.entries(p.figure)) {
                out += '      ' + k + ': ' + flowStringify(v) + '\n';
            }
        }
    }
    return out;
}
function flowStringify(v) {
    if (Array.isArray(v)) return '[' + v.map(flowStringify).join(', ') + ']';
    if (typeof v === 'string') return yamlEscapeString(v);
    if (v === null || v === undefined) return 'null';
    return String(v);
}

/* ========================= フォーム: 図フィールド表示切替 ========================= */
document.getElementById('f_figtype').addEventListener('change', (e) => {
    ['axes', 'polygon', 'circle', 'number_line'].forEach(t => {
        document.getElementById('fig_' + t).style.display = (t === e.target.value) ? 'block' : 'none';
    });
});

function parsePairs(str) {
    // "1,2 ; -1,0" -> [[1,2],[-1,0]]
    if (!str || !str.trim()) return [];
    return str.split(';').map(s => s.trim()).filter(Boolean).map(pair => pair.split(',').map(n => Number(n.trim())));
}
function parseCsv(str) {
    if (!str || !str.trim()) return [];
    return str.split(',').map(s => s.trim()).filter(Boolean);
}
function parseCsvNum(str) {
    return parseCsv(str).map(Number);
}

function buildFigureFromForm() {
    const type = document.getElementById('f_figtype').value;
    if (!type) return null;
    if (type === 'axes') {
        const xr = parseCsvNum(document.getElementById('ax_xrange').value);
        const yr = parseCsvNum(document.getElementById('ax_yrange').value);
        const funcs = parseCsv(document.getElementById('ax_functions').value);
        const pts = parsePairs(document.getElementById('ax_points').value);
        const fig = { type: 'axes' };
        if (xr.length === 2) fig.xrange = xr;
        if (yr.length === 2) fig.yrange = yr;
        if (funcs.length) fig.functions = funcs;
        if (pts.length) fig.points = pts;
        return fig;
    }
    if (type === 'polygon') {
        const pts = parsePairs(document.getElementById('pg_points').value);
        const labels = parseCsv(document.getElementById('pg_labels').value);
        const showLen = document.getElementById('pg_lengths').checked;
        const fig = { type: 'polygon', points: pts };
        if (labels.length) fig.labels = labels;
        fig.show_lengths = showLen;
        return fig;
    }
    if (type === 'circle') {
        const center = parseCsvNum(document.getElementById('ci_center').value);
        const radius = Number(document.getElementById('ci_radius').value);
        return { type: 'circle', center: center.length === 2 ? center : [0, 0], radius, show_radius: document.getElementById('ci_show_radius').checked };
    }
    if (type === 'number_line') {
        const min = Number(document.getElementById('nl_min').value);
        const max = Number(document.getElementById('nl_max').value);
        const step = Number(document.getElementById('nl_step').value);
        const marks = parseCsvNum(document.getElementById('nl_marks').value);
        const fig = { type: 'number_line', min, max, step };
        if (marks.length) fig.marks = marks;
        return fig;
    }
    return null;
}

function addProblemFromForm() {
    const text = document.getElementById('f_text').value.trim();
    if (!text) { alert('問題文を入力してください'); return; }
    const figure = buildFigureFromForm();
    problems.push({ text, figure });
    document.getElementById('f_text').value = '';
    document.getElementById('f_figtype').value = '';
    document.getElementById('f_figtype').dispatchEvent(new Event('change'));
    renderProblemList();
    syncYamlFromProblems();
}

function removeProblem(idx) {
    problems.splice(idx, 1);
    renderProblemList();
    syncYamlFromProblems();
}

function renderProblemList() {
    const el = document.getElementById('problemList');
    el.innerHTML = '';
    problems.forEach((p, idx) => {
        const div = document.createElement('div');
        div.className = 'problem-list-item';
        const txt = document.createElement('div');
        txt.className = 'txt';
        txt.textContent = (idx + 1) + '. ' + p.text + (p.figure ? '  [図: ' + p.figure.type + ']' : '');
        const btn = document.createElement('button');
        btn.className = 'danger small-btn';
        btn.textContent = '削除';
        btn.onclick = () => removeProblem(idx);
        div.appendChild(txt);
        div.appendChild(btn);
        el.appendChild(div);
    });
}

function syncYamlFromProblems() {
    const title = document.getElementById('ws_title').value;
    document.getElementById('yamlText').value = yamlStringify({ title, problems });
}

function syncFormListFromYaml() {
    try {
        const data = yamlParse(document.getElementById('yamlText').value) || {};
        problems = (data.problems || []).map(p => ({ text: p.text || '', figure: p.figure || null }));
        if (data.title) document.getElementById('ws_title').value = data.title;
        renderProblemList();
    } catch (e) {
        alert('YAMLの読み込みに失敗しました: ' + e.message);
    }
}

/* ========================= ファイル 読み込み/保存 ========================= */
function loadYamlFile(evt) {
    const file = evt.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        document.getElementById('yamlText').value = reader.result;
        syncFormListFromYaml();
    };
    reader.readAsText(file);
    evt.target.value = '';
}

function downloadYaml() {
    syncYamlFromProblems();
    const blob = new Blob([document.getElementById('yamlText').value], { type: 'text/yaml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const title = document.getElementById('ws_title').value.trim() || 'problems';
    a.download = title.replace(/\s+/g, '_') + '.yaml';
    a.click();
    URL.revokeObjectURL(a.href);
}

/* ========================= ミニ数式レンダラ（LaTeXサブセット） ========================= */
function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderMathSegment(s) {
    let i = 0;
    function readGroup() {
        if (s[i] === '{') {
            let depth = 0, start = i;
            while (i < s.length) {
                if (s[i] === '{') depth++;
                if (s[i] === '}') { depth--; if (depth === 0) { i++; break; } }
                i++;
            }
            return s.slice(start + 1, i - 1);
        }
        // single token (char or command)
        if (s[i] === '\\') {
            let start = i; i++;
            while (i < s.length && /[a-zA-Z]/.test(s[i])) i++;
            return s.slice(start, i);
        }
        return s[i++];
    }
    function parse() {
        let out = '';
        while (i < s.length) {
            const c = s[i];
            if (c === '\\') {
                const start = i;
                i++;
                let cmd = '';
                while (i < s.length && /[a-zA-Z]/.test(s[i])) { cmd += s[i]; i++; }
                if (cmd === 'frac') {
                    const num = readGroup();
                    const den = readGroup();
                    out += `<span class="mfrac"><span class="num">${parseSub(num)}</span><span class="den">${parseSub(den)}</span></span>`;
                } else if (cmd === 'sqrt') {
                    const content = readGroup();
                    out += `<span class="msqrt"><span class="rad">&#8730;</span><span class="content">${parseSub(content)}</span></span>`;
                } else {
                    const symbols = {
                        times: '&times;', div: '&divide;', pm: '&plusmn;', cdot: '&middot;',
                        leq: '&le;', geq: '&ge;', neq: '&ne;', pi: '&pi;', circ: '&deg;',
                        angle: '&ang;', triangle: '&#9651;', infty: '&infin;', approx: '&asymp;'
                    };
                    out += symbols[cmd] !== undefined ? symbols[cmd] : escapeHtml(s.slice(start, i));
                }
            } else if (c === '^') {
                i++;
                const content = readGroup();
                out += `<sup class="mexp">${parseSub(content)}</sup>`;
            } else if (c === '_') {
                i++;
                const content = readGroup();
                out += `<sub class="msub">${parseSub(content)}</sub>`;
            } else {
                out += escapeHtml(c);
                i++;
            }
        }
        return out;
    }
    function parseSub(str) {
        const saved = { s, i };
        const localParse = renderMathSegment(str);
        return localParse;
    }
    return parse();
}

function renderProblemText(text) {
    if (!text) return '';
    const parts = text.split('$');
    let out = '';
    parts.forEach((part, idx) => {
        if (idx % 2 === 1) {
            out += renderMathSegment(part);
        } else {
            out += escapeHtml(part).replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
        }
    });
    return out;
}

/* ========================= 数式評価（グラフ用の簡易 x の式パーサ） ========================= */
function evalExprAtX(expr, x) {
    // サポート: + - * / ^ ( ) 数値 x
    let i = 0;
    const s = expr.replace(/\s+/g, '');
    function peek() { return s[i]; }
    function parseNum() {
        if (s[i] === 'x') { i++; return x; }
        if (s[i] === '(') { i++; const v = parseExpr(); i++; /* ) */ return v; }
        let start = i;
        if (s[i] === '-') i++;
        while (i < s.length && /[0-9.]/.test(s[i])) i++;
        return parseFloat(s.slice(start, i));
    }
    function parsePow() {
        let base = parseNum();
        if (peek() === '^') { i++; const exp = parsePow(); return Math.pow(base, exp); }
        return base;
    }
    function parseTerm() {
        let v = parsePow();
        while (peek() === '*' || peek() === '/') {
            const op = s[i]; i++;
            const rhs = parsePow();
            v = op === '*' ? v * rhs : v / rhs;
        }
        return v;
    }
    function parseExpr() {
        let v = parseTerm();
        while (peek() === '+' || peek() === '-') {
            const op = s[i]; i++;
            const rhs = parseTerm();
            v = op === '+' ? v + rhs : v - rhs;
        }
        return v;
    }
    try { return parseExpr(); } catch (e) { return NaN; }
}

/* ========================= SVG 図形描画 ========================= */
const SVG_W = 280, SVG_H = 200;

function svgOpen(w, h) {
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="border:1px solid #ddd;background:#fff">`;
}

function renderFigure(fig) {
    if (!fig || !fig.type) return '';
    if (fig.type === 'axes') return renderAxes(fig);
    if (fig.type === 'polygon') return renderPolygon(fig);
    if (fig.type === 'circle') return renderCircle(fig);
    if (fig.type === 'number_line') return renderNumberLine(fig);
    return '';
}

function renderAxes(fig) {
    const [xmin, xmax] = fig.xrange || [-5, 5];
    const [ymin, ymax] = fig.yrange || [-5, 5];
    const pad = 20;
    const w = SVG_W, h = SVG_H;
    const sx = (x) => pad + (x - xmin) / (xmax - xmin) * (w - 2 * pad);
    const sy = (y) => h - pad - (y - ymin) / (ymax - ymin) * (h - 2 * pad);
    let s = svgOpen(w, h);
    // grid
    for (let gx = Math.ceil(xmin); gx <= xmax; gx++) {
        s += `<line x1="${sx(gx)}" y1="${pad}" x2="${sx(gx)}" y2="${h - pad}" stroke="#eee" stroke-width="1"/>`;
    }
    for (let gy = Math.ceil(ymin); gy <= ymax; gy++) {
        s += `<line x1="${pad}" y1="${sy(gy)}" x2="${w - pad}" y2="${sy(gy)}" stroke="#eee" stroke-width="1"/>`;
    }
    // axes
    s += `<line x1="${pad}" y1="${sy(0)}" x2="${w - pad}" y2="${sy(0)}" stroke="#333" stroke-width="1.2"/>`;
    s += `<line x1="${sx(0)}" y1="${pad}" x2="${sx(0)}" y2="${h - pad}" stroke="#333" stroke-width="1.2"/>`;
    // functions
    const colors = ['#e63946', '#1d3557', '#2a9d8f', '#e76f51'];
    (fig.functions || []).forEach((fn, idx) => {
        let d = '';
        let penDown = false;
        const steps = 100;
        for (let n = 0; n <= steps; n++) {
            const x = xmin + (xmax - xmin) * n / steps;
            const y = evalExprAtX(fn, x);
            if (isNaN(y) || !isFinite(y) || y < ymin || y > ymax) { penDown = false; continue; }
            const px = sx(x), py = sy(y);
            d += (penDown ? 'L' : 'M') + px.toFixed(1) + ',' + py.toFixed(1) + ' ';
            penDown = true;
        }
        s += `<path d="${d}" fill="none" stroke="${colors[idx % colors.length]}" stroke-width="1.8"/>`;
    });
    // points
    (fig.points || []).forEach(([x, y]) => {
        s += `<circle cx="${sx(x)}" cy="${sy(y)}" r="3" fill="#333"/>`;
    });
    s += '</svg>';
    return s;
}

function polygonBounds(points) {
    const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
    return { xmin: Math.min(...xs), xmax: Math.max(...xs), ymin: Math.min(...ys), ymax: Math.max(...ys) };
}

function renderPolygon(fig) {
    const points = fig.points || [];
    if (points.length < 2) return '';
    const b = polygonBounds(points);
    const pad = 30;
    const w = SVG_W, h = SVG_H;
    const spanX = (b.xmax - b.xmin) || 1, spanY = (b.ymax - b.ymin) || 1;
    const scale = Math.min((w - 2 * pad) / spanX, (h - 2 * pad) / spanY);
    const sx = (x) => pad + (x - b.xmin) * scale;
    const sy = (y) => h - pad - (y - b.ymin) * scale;
    let s = svgOpen(w, h);
    const pts = points.map(p => sx(p[0]) + ',' + sy(p[1])).join(' ');
    s += `<polygon points="${pts}" fill="#eaf4ff" stroke="#1d3557" stroke-width="1.8"/>`;
    const labels = fig.labels || [];
    points.forEach((p, idx) => {
        const px = sx(p[0]), py = sy(p[1]);
        s += `<circle cx="${px}" cy="${py}" r="2.5" fill="#1d3557"/>`;
        if (labels[idx]) {
            s += `<text x="${px + 6}" y="${py - 6}" font-size="13" fill="#111">${escapeHtml(String(labels[idx]))}</text>`;
        }
    });
    if (fig.show_lengths) {
        for (let idx = 0; idx < points.length; idx++) {
            const a = points[idx], bpt = points[(idx + 1) % points.length];
            const len = Math.hypot(bpt[0] - a[0], bpt[1] - a[1]);
            const mx = (sx(a[0]) + sx(bpt[0])) / 2, my = (sy(a[1]) + sy(bpt[1])) / 2;
            s += `<text x="${mx}" y="${my}" font-size="12" fill="#555" text-anchor="middle">${len.toFixed(2)}</text>`;
        }
    }
    s += '</svg>';
    return s;
}

function renderCircle(fig) {
    const center = fig.center || [0, 0];
    const r = fig.radius || 1;
    const w = SVG_W, h = SVG_H;
    const pad = 30;
    const scale = (Math.min(w, h) - 2 * pad) / (2 * r);
    const cx = w / 2, cy = h / 2;
    let s = svgOpen(w, h);
    s += `<circle cx="${cx}" cy="${cy}" r="${r * scale}" fill="#eaf4ff" stroke="#1d3557" stroke-width="1.8"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="2.5" fill="#1d3557"/>`;
    if (fig.show_radius) {
        s += `<line x1="${cx}" y1="${cy}" x2="${cx + r * scale}" y2="${cy}" stroke="#e63946" stroke-width="1.5"/>`;
        s += `<text x="${cx + r * scale / 2}" y="${cy - 6}" font-size="12" fill="#e63946" text-anchor="middle">${r}</text>`;
    }
    s += '</svg>';
    return s;
}

function renderNumberLine(fig) {
    const min = fig.min ?? -5, max = fig.max ?? 5, step = fig.step || 1;
    const w = SVG_W, h = 80;
    const pad = 20;
    const sx = (x) => pad + (x - min) / (max - min) * (w - 2 * pad);
    let s = svgOpen(w, h);
    const y = h / 2;
    s += `<line x1="${pad}" y1="${y}" x2="${w - pad}" y2="${y}" stroke="#333" stroke-width="1.5"/>`;
    for (let v = min; v <= max + 1e-9; v += step) {
        const x = sx(v);
        s += `<line x1="${x}" y1="${y - 6}" x2="${x}" y2="${y + 6}" stroke="#333" stroke-width="1.2"/>`;
        s += `<text x="${x}" y="${y + 20}" font-size="11" text-anchor="middle">${Number(v.toFixed(4))}</text>`;
    }
    (fig.marks || []).forEach(m => {
        const x = sx(m);
        s += `<circle cx="${x}" cy="${y}" r="4" fill="#e63946"/>`;
    });
    s += '</svg>';
    return s;
}

/* ========================= ワークシート生成 ========================= */
function generateWorksheet() {
    let data;
    try {
        data = yamlParse(document.getElementById('yamlText').value) || {};
    } catch (e) {
        alert('YAMLの解析に失敗しました: ' + e.message);
        return;
    }
    const title = document.getElementById('ws_title').value || data.title || '数学プリント';
    document.getElementById('wsTitleOut').textContent = title;
    const content = document.getElementById('wsContent');
    content.innerHTML = '';
    const list = data.problems || problems;
    list.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'prow';
        const main = document.createElement('div');
        main.className = 'p-main';
        const textDiv = document.createElement('div');
        textDiv.className = 'p-text';
        textDiv.innerHTML = `<span class="p-num">(${idx + 1})</span>` + renderProblemText(p.text || '');
        main.appendChild(textDiv);
        if (p.figure) {
            const figDiv = document.createElement('div');
            figDiv.className = 'p-figure';
            figDiv.innerHTML = renderFigure(p.figure);
            main.appendChild(figDiv);
        }
        const answer = document.createElement('div');
        answer.className = 'p-answer';
        row.appendChild(main);
        row.appendChild(answer);
        content.appendChild(row);
    });
    document.getElementById('worksheet').style.display = 'block';
    document.getElementById('worksheet').scrollIntoView({ behavior: 'smooth' });
}

/* ========================= 共有（サーバー保存） ========================= */
async function shareWorksheet() {
    syncYamlFromProblems();
    const title = document.getElementById('ws_title').value || '数学プリント';
    const yaml = document.getElementById('yamlText').value;
    const btn = document.getElementById('shareBtn');
    btn.disabled = true;
    btn.textContent = '発行中...';
    try {
        const res = await fetch('/api/problems', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, yaml })
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || ('HTTP ' + res.status));
        }
        const { url } = await res.json();
        const fullUrl = location.origin + url;
        document.getElementById('shareResult').style.display = 'block';
        document.getElementById('shareUrl').value = fullUrl;
        document.getElementById('shareNote').textContent = 'このリンクは誰でも開けます（ログイン不要）。共有後に元の問題を編集しても、発行済みのリンク先には反映されません（再度発行してください）。';
    } catch (e) {
        alert('共有リンクの発行に失敗しました: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '🔗 共有リンクを発行';
    }
}

function copyShareUrl() {
    const el = document.getElementById('shareUrl');
    el.select();
    navigator.clipboard && navigator.clipboard.writeText(el.value).catch(() => {});
}

/* ========================= 共有URL（/p/:id）からの自動読み込み ========================= */
async function loadFromShareIdIfPresent() {
    const m = location.pathname.match(/^\/p\/([a-f0-9]{10})$/);
    if (!m) return false;
    try {
        const res = await fetch('/api/problems/' + m[1]);
        if (!res.ok) throw new Error('問題が見つかりませんでした');
        const data = await res.json();
        document.getElementById('ws_title').value = data.title || '数学プリント';
        document.getElementById('yamlText').value = data.yaml || '';
        syncFormListFromYaml();
        generateWorksheet();
        return true;
    } catch (e) {
        alert('共有された問題の読み込みに失敗しました: ' + e.message);
        return false;
    }
}

/* ========================= 初期化 ========================= */
(async function init() {
    const loadedFromShare = await loadFromShareIdIfPresent();
    if (!loadedFromShare) {
        problems = [
            { text: '次の式を計算しなさい。 $\\frac{1}{2} + \\frac{1}{3}$', figure: null },
            { text: '$\\sqrt{2} \\times \\sqrt{8}$ を計算しなさい。', figure: null },
            { text: '次の三角形の面積を求めなさい。', figure: { type: 'polygon', points: [[0, 0], [4, 0], [2, 3]], labels: ['A', 'B', 'C'], show_lengths: true } },
            { text: '一次関数 $y = 2x + 1$ のグラフをかきなさい。', figure: { type: 'axes', xrange: [-5, 5], yrange: [-5, 5], functions: ['2*x+1'] } },
            { text: '半径5の円の面積を求めなさい。', figure: { type: 'circle', center: [0, 0], radius: 5, show_radius: true } }
        ];
        renderProblemList();
        syncYamlFromProblems();
    }
})();
