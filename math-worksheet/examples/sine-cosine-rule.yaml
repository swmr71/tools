title: "正弦定理・余弦定理 演習プリント"
problems:
  - text: "$\\triangle ABC$ において、$a = 6$, $A = 30$° のとき、外接円の半径 $R$ を求めなさい。"
  - text: "$\\triangle ABC$ において、$b = 4$, $B = 45$°, $C = 60$° のとき、辺 $c$ の長さを求めなさい。"
  - text: "$\\triangle ABC$ において、$a = \\sqrt{2}$, $b = 2$, $A = 30$° のとき、角 $B$ の大きさを求めなさい。"
  - text: "外接円の半径が $R = 5$ である $\\triangle ABC$ において、$A = 45$° のとき、辺 $a$ の長さを求めなさい。"
  - text: "$\\triangle ABC$ において、$a = 3$, $B = 60$°, $C = 75$° のとき、外接円の半径 $R$ および辺 $c$ の長さを求めなさい。"
  - text: "$\\triangle ABC$ において、$b = 3$, $c = 5$, $A = 60$° のとき、辺 $a$ の長さを求めなさい。"
  - text: "$\\triangle ABC$ において、$a = 7$, $c = 8$, $B = 120$° のとき、辺 $b$ の長さを求めなさい。"
  - text: "$\\triangle ABC$ において、$a = \\sqrt{3}$, $b = 1$, $c = 2$ のとき、角 $A$ の大きさを求めなさい。"
  - text: "$\\triangle ABC$ において、$a = 3$, $b = 5$, $c = 7$ のとき、最大角の大きさを求めなさい。"
  - text: "$\\triangle ABC$ において、$a = 4$, $b = 5$, $c = 6$ のとき、$\\cos A$ の値を求めなさい。"
  - text: "$\\triangle ABC$ において、$a = 5$, $b = 8$, $C = 60$° のとき、辺 $c$ の長さと外接円の半径 $R$ を求めなさい。"
  - text: "$\\triangle ABC$ において、$a = \\sqrt{6}$, $b = 2$, $c = 1 + \\sqrt{3}$ のとき、角 $A$ の大きさを求めなさい。"
  - text: "$\\triangle ABC$ において、$\\sin A : \\sin B : \\sin C = 3 : 5 : 7$ が成り立つとき、角 $C$ の大きさを求めなさい。"
  - text: "$\\triangle ABC$ において、$a \\cos B = b \\cos A$ が成り立つとき、この三角形はどのような形をしているか答えなさい。"
  - text: "$\\triangle ABC$ において、$a = 4$, $b = 5$, $C = 120$° のとき、三角形の面積 $S$ を求めなさい。"
  - text: "$\\triangle ABC$ において、$a = 7$, $b = 8$, $c = 9$ のとき、三角形の面積 $S$ を求めなさい。"
  - text: "$\\triangle ABC$ の3辺の長さが $a = 4$, $b = 5$, $c = 6$ であるとき、内接円の半径 $r$ を求めなさい。"
  - text: "円に内接する四角形 ABCD において、$AB = 2$, $BC = 3$, $CD = 4$, $DA = 3$ のとき、対角線 $AC$ の長さを求めなさい。"
  - text: "1辺の長さが4の正四面体 ABCD において、辺 BC の中点を M とする。$\\angle AMD = \\theta$ とするとき、$\\cos \\theta$ の値を求めなさい。"
  - text: "地点 A から塔の先端 P の見上げ角が30°、地点 B からは45°であった。塔の直下の地点を O とし、$\\angle AOB = 60$°、$AB = 100\\text{ m}$ であるとき、塔の高さ $h$ を求めなさい。"
